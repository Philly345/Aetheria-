<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <div id="auth-overlay" class="overlay">
      <div class="auth-modal">
        <h2>AETHERIA</h2>
        <p>Access requires authentication.</p>
        <button id="google-signin-btn" class="auth-btn">
          <svg viewBox="0 0 24 24" class="google-icon" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
          Sign in with Google
        </button>
      </div>
    </div>

    <div id="header">
      <span id="title">AETHERIA</span>
      <button id="clear-btn" title="Clear Chat">X</button>
    </div>

    <div id="chat-container">
      <div id="messages"></div>
      <div id="drop-zone" class="hidden">
        <span>DROP FILES</span>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrapper" class="pill-bar">
        <label for="file-upload" id="attach-btn" title="Attach File">+</label>
        <input type="file" id="file-upload" accept=".txt,.csv,.pdf">

        <div class="dropdowns">
          <button class="mode-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            Normal
          </button>
          <button class="mode-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.52 14.5a5.5 5.5 0 0 1-5.02-3.1 5.5 5.5 0 0 1 1.05-6.3A5.5 5.5 0 0 1 12 3a5.5 5.5 0 0 1 6.45 2.1 5.5 5.5 0 0 1 1.05 6.3 5.5 5.5 0 0 1-5.02 3.1"></path>
              <line x1="9" y1="18" x2="15" y2="18"></line>
              <line x1="10" y1="22" x2="14" y2="22"></line>
              <line x1="12" y1="14.5" x2="12" y2="22"></line>
            </svg>
            DeepThink
          </button>
        </div>

        <button id="voice-btn" class="icon-btn" title="Voice Input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <textarea id="message-input" placeholder="Ask anything..." rows="1"></textarea>

        <button id="send-btn" class="gradient-btn" title="Send Message">➤</button>
      </div>
    </div>
  </div>
  <!-- We can use marked.js for markdown rendering, or a simple custom one. For independence, we'll write a simple regex-based parser in panel.js if external scripts are not desired. -->
  <script src="panel.js"></script>
</body>
</html>
