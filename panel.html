<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <div id="auth-overlay" class="overlay">
      <div class="auth-modal">
        <h2>AETHERIA</h2>
        <p>Access requires authentication.</p>
        <div class="auth-form">
          <input type="email" id="auth-email" placeholder="Email" class="auth-input">
          <input type="password" id="auth-password" placeholder="Password" class="auth-input">
          <div class="auth-actions">
            <button id="login-btn" class="auth-btn">Log In</button>
            <button id="signup-btn" class="auth-btn signup">Sign Up</button>
          </div>
          <div id="auth-error" class="auth-error hidden"></div>
        </div>
      </div>
    </div>

    <div id="header">
      <span id="title">AETHERIA</span>
      <button id="clear-btn" title="Clear Chat">X</button>
    </div>

    <div id="chat-container">
      <div id="messages"></div>
      <div id="drop-zone" class="hidden">
        <span>DROP FILES</span>
      </div>
    </div>


    <div id="input-area">
      <!-- Glow backgrounds -->
      <div class="glow-bg glow-warm"></div>
      <div class="glow-bg glow-cool"></div>

      <div id="input-wrapper" class="pill-bar">
        <div class="input-top">
          <textarea id="message-input" placeholder="Ask anything..." rows="1"></textarea>
        </div>
        <div class="input-bottom">
          <div class="bottom-left">
            <label for="file-upload" id="attach-btn" title="Attach File">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </label>
            <input type="file" id="file-upload" accept=".txt,.csv,.pdf">

            <button class="mode-btn active-mode">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              Normal
              <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <button class="mode-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.52 14.5a5.5 5.5 0 0 1-5.02-3.1 5.5 5.5 0 0 1 1.05-6.3A5.5 5.5 0 0 1 12 3a5.5 5.5 0 0 1 6.45 2.1 5.5 5.5 0 0 1 1.05 6.3 5.5 5.5 0 0 1-5.02 3.1"></path>
                <line x1="9" y1="18" x2="15" y2="18"></line>
                <line x1="10" y1="22" x2="14" y2="22"></line>
                <line x1="12" y1="14.5" x2="12" y2="22"></line>
              </svg>
              DeepThink
              <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
          <div class="bottom-right">
            <button id="voice-btn" class="icon-btn action-pill" title="Voice Input">
              <svg class="icon waveform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="4" x2="12" y2="20"></line>
                <line x1="8" y1="9" x2="8" y2="15"></line>
                <line x1="16" y1="9" x2="16" y2="15"></line>
                <line x1="4" y1="11" x2="4" y2="13"></line>
                <line x1="20" y1="11" x2="20" y2="13"></line>
              </svg>
              Voice
            </button>

            <button id="send-btn" class="gradient-btn" title="Send Message">
              <svg class="icon paper-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- We can use marked.js for markdown rendering, or a simple custom one. For independence, we'll write a simple regex-based parser in panel.js if external scripts are not desired. -->
  <script src="lib/pdf.js"></script>
  <script src="panel.js"></script>
</body>
</html>
