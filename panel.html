<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <div id="auth-overlay" class="overlay hidden">
      <div class="auth-modal">
        <h2>PRIVACY SETTINGS</h2>
        <p>No account is required. Keep everything local or connect your own AI endpoint.</p>
        <div class="auth-form">
          <label class="settings-label" for="ai-endpoint">AI endpoint</label>
          <input type="url" id="ai-endpoint" placeholder="https://example.com/api/chat" class="auth-input">

          <label class="toggle-row">
            <input type="checkbox" id="local-only-toggle">
            <span>Local-only mode</span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="redact-toggle">
            <span>Redact personal data before sending</span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="history-toggle">
            <span>Store chat history locally</span>
          </label>

          <div class="auth-actions">
            <button id="save-settings-btn" class="auth-btn">Save</button>
            <button id="close-settings-btn" class="auth-btn signup">Close</button>
          </div>
          <div id="auth-error" class="auth-error hidden"></div>
        </div>
      </div>
    </div>

    <div id="header">
      <span id="title">AETHERIA</span>
      <div id="header-actions">
        <span id="privacy-status" class="privacy-status">Private mode ready</span>
        <button id="settings-btn" title="Privacy Settings">⚙</button>
        <button id="clear-btn" title="Clear Chat">X</button>
      </div>
    </div>

    <div id="chat-container">
      <div id="messages"></div>
      <div id="drop-zone" class="hidden">
        <span>DROP FILES</span>
      </div>
    </div>

    <div id="input-area">
      <div class="glow-bg glow-warm"></div>
      <div class="glow-bg glow-cool"></div>

      <div id="input-wrapper" class="pill-bar">
        <div class="input-top">
          <textarea id="message-input" placeholder="Ask anything..." rows="1"></textarea>
        </div>
        <div class="input-bottom">
          <div class="bottom-left">
            <button type="button" id="attach-btn" title="Attach File" aria-label="Attach File">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <input type="file" id="file-upload" accept=".txt,.csv,.pdf">

            <div class="mode-dropdown" id="mode-dropdown">
              <button type="button" id="mode-trigger" class="mode-btn active-mode" aria-haspopup="true" aria-expanded="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span id="mode-label">Normal</span>
                <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div id="mode-menu" class="mode-menu hidden" role="menu">
                <button type="button" class="mode-option active" data-mode="normal" role="menuitem">Normal</button>
                <button type="button" class="mode-option" data-mode="deepthink" role="menuitem">DeepThink</button>
              </div>
            </div>

            <button type="button" id="talk-btn" class="action-pill" title="Talk to AI">Talk</button>
            <button type="button" id="screen-btn" class="action-pill" title="Share Screen">Share</button>
          </div>
          <div class="bottom-right">
            <button id="voice-btn" class="action-pill" title="Voice Dictation">
              <svg class="icon waveform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="4" x2="12" y2="20"></line>
                <line x1="8" y1="9" x2="8" y2="15"></line>
                <line x1="16" y1="9" x2="16" y2="15"></line>
                <line x1="4" y1="11" x2="4" y2="13"></line>
                <line x1="20" y1="11" x2="20" y2="13"></line>
              </svg>
              <span id="voice-label">Dictate</span>
            </button>

            <button id="send-btn" class="gradient-btn" title="Send Message">
              <svg class="icon paper-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/pdf.js"></script>
  <script src="panel.js"></script>
</body>
</html>
